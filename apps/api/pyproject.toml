[project]
name = "ai-research-agent-api"
version = "0.3.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = [
    "B008",      # FastAPI dependencies in argument defaults
    "UP007",     # keep Optional[...] where it reads better
    "UP045",
    "UP042",     # str-based enums are stored as-is in existing databases
    "ASYNC109",  # `timeout` parameters are imposed by httpcore's backend interface
]

[tool.ruff.lint.per-file-ignores]
# Natural-language prompt and demo templates
"app/agents/*/prompts.py" = ["E501"]
"app/providers/*/mock.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "helpers"]
